{% extends 'base.html' %}
{% block title %}{{ 'Sửa sách' if is_edit else 'Thêm sách' }} — LibraHub{% endblock %}
{% block content %}
<section class="page-hero compact"><span class="section-kicker">KHO TÀI LIỆU</span><h1>{{ 'Cập nhật sách' if is_edit else 'Thêm sách mới' }}</h1><p>Thông tin sẽ được lưu trực tiếp vào cơ sở dữ liệu.</p></section>
<section class="container narrow-wide section"><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-section"><h2>Thông tin cơ bản</h2><div class="form-grid"><label class="full">Tên sách *<input name="title" required value="{{ request.form.get('title', book.title or '') }}"></label><label>ISBN *<input name="isbn" required value="{{ request.form.get('isbn', book.isbn or '') }}"></label><label>Tác giả <small>(ngăn cách bằng dấu phẩy)</small><input name="authors" value="{{ request.form.get('authors', book.author_names if book.authors else '') }}"></label><label>Thể loại<select name="category_id"><option value="">Chưa phân loại</option>{% for category in categories %}<option value="{{ category.id }}" {{ 'selected' if book.category_id == category.id }}>{{ category.name }}</option>{% endfor %}</select></label><label>Nhà xuất bản<input name="publisher" value="{{ request.form.get('publisher', book.publisher or '') }}"></label><label>Năm xuất bản<input type="number" name="published_year" min="1000" max="2100" value="{{ request.form.get('published_year', book.published_year or '') }}"></label><label>Vị trí kệ<input name="location" value="{{ request.form.get('location', book.location or '') }}" placeholder="A-02-03"></label><label>Số lượng *<input type="number" name="total_copies" min="0" required value="{{ request.form.get('total_copies', book.total_copies) }}"></label><label class="full">URL ảnh bìa<input type="url" name="cover_url" value="{{ request.form.get('cover_url', book.cover_url or '') }}" placeholder="https://..."></label><label class="full">Mô tả<textarea name="description" rows="6">{{ request.form.get('description', book.description or '') }}</textarea></label></div></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('librarian.books') }}">Hủy</a><button class="btn btn-primary">{{ 'Lưu thay đổi' if is_edit else 'Thêm vào kho' }}</button></div></form></section>
{% endblock %}
