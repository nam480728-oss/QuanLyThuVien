<!doctype html>
<html lang="vi" class="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LibAdmin - Thêm / Cập nhật Sách</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #191c1e; }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px;
    line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap;
    word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle;
  }
  .font-mono-sm { font-family: 'JetBrains Mono', monospace; }
  .shadow-2xs { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04); }
</style>
</head>
<body class="bg-[#f7f9fb] text-[#191c1e] font-sans antialiased">

<div class="p-4 md:p-6 lg:p-8 space-y-6 max-w-5xl mx-auto">
  <!-- Breadcrumb & Header -->
  <div class="border-b border-slate-200 pb-4 flex items-center justify-between">
    <div>
      <div class="text-xs text-slate-500 mb-1">
        <span>Danh mục</span> / <span id="mode-breadcrumb">Cập nhật thông tin</span>
      </div>
      <h2 id="mode-title" class="text-2xl font-bold text-slate-900 tracking-tight">Cập nhật Thông tin Sách</h2>
    </div>
    <button id="btn-delete-record" type="button" class="px-3.5 py-2 text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-xl text-xs font-semibold transition-colors flex items-center gap-1.5">
      <span class="material-symbols-outlined text-base">delete</span>
      <span>Xóa bản ghi</span>
    </button>
  </div>

  <form id="book-form" class="space-y-6">
    <!-- Section 1: Thông tin chung -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-2xs space-y-4">
      <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center gap-2 border-b border-slate-100 pb-3">
        <span class="material-symbols-outlined text-blue-600 text-lg">auto_stories</span>
        1. Thông tin Chung
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="text-xs font-semibold text-slate-700 block mb-1">Tiêu đề sách (*)</label>
          <input type="text" required id="f-title" value="Thiết kế Giao diện Hiện đại: Từ Nguyên lý đến Thực tiễn"
            placeholder="Nhập tiêu đề chính của sách..."
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Phụ đề (Subtitle)</label>
          <input type="text" id="f-subtitle" value="Phương pháp và Thực hành Hiệu quả"
            placeholder="Phụ đề hoặc tiêu đề gốc tiếng Anh..."
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Tác giả chính (*)</label>
          <input type="text" required id="f-author" value="TS. Nguyễn Văn A"
            placeholder="Ví dụ: Joshua Bloch, Robert C. Martin..."
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Đồng tác giả / Người dịch</label>
          <input type="text" id="f-coauthor" value="Trần B"
            placeholder="Nhập tên người đồng tác giả..."
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Thể loại / Chuyên ngành</label>
          <select id="f-category" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="Khoa học máy tính">Khoa học máy tính</option>
            <option value="Phần mềm">Phần mềm &amp; Lập trình</option>
            <option value="Thiết kế UI/UX" selected>Thiết kế UI/UX</option>
            <option value="Dữ liệu">Cơ sở dữ liệu &amp; AI</option>
            <option value="Tâm lý & Kỹ năng">Tâm lý &amp; Kỹ năng</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="text-xs font-semibold text-slate-700 block mb-1">Mô tả tóm tắt nội dung</label>
          <textarea rows="4" id="f-description" placeholder="Tóm tắt nội dung, cấu trúc chương, đối tượng độc giả hướng tới..."
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm leading-relaxed focus:ring-2 focus:ring-blue-500 focus:outline-none">Cuốn sách cung cấp một cái nhìn toàn diện về quy trình thiết kế giao diện người dùng (UI) hiện đại, tập trung vào việc áp dụng các nguyên lý thiết kế tối giản, hệ thống lưới (grid systems), và lý thuyết màu sắc.</textarea>
        </div>
      </div>
    </div>

    <!-- Section 2: Định danh & Xuất bản -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-2xs space-y-4">
      <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center gap-2 border-b border-slate-100 pb-3">
        <span class="material-symbols-outlined text-blue-600 text-lg">qr_code</span>
        2. Định danh &amp; Xuất bản
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Mã ISBN-13 (*)</label>
          <input type="text" required id="f-isbn" value="978-604-1-12345" placeholder="978-0134685991"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Mã ISBN-10</label>
          <input type="text" id="f-isbn10" value="6041123456" placeholder="0134685997"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Nhà xuất bản</label>
          <input type="text" id="f-publisher" value="NXB Công nghệ" placeholder="Addison-Wesley, NXB Giáo dục..."
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Năm xuất bản</label>
          <input type="number" id="f-year" value="2023"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Phiên bản / Tái bản</label>
          <input type="text" id="f-edition" value="Tái bản lần 1" placeholder="Tái bản lần 2, 20th Anniversary..."
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Ngôn ngữ</label>
          <select id="f-language" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="Tiếng Việt" selected>Tiếng Việt</option>
            <option value="Tiếng Anh">Tiếng Anh</option>
            <option value="Song ngữ Anh - Việt">Song ngữ Anh - Việt</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Section 3: Kho & Vị trí Lưu trữ -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-2xs space-y-4">
      <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center gap-2 border-b border-slate-100 pb-3">
        <span class="material-symbols-outlined text-blue-600 text-lg">shelves</span>
        3. Quản lý Kho &amp; Vị trí Lưu trữ
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Loại tài liệu</label>
          <div class="flex gap-2">
            <button type="button" id="type-physical-btn" class="flex-1 py-2 rounded-xl text-xs font-semibold border bg-blue-50 text-blue-700 border-blue-500">Sách giấy</button>
            <button type="button" id="type-digital-btn" class="flex-1 py-2 rounded-xl text-xs font-semibold border bg-slate-50 text-slate-700 border-slate-200">Tài liệu số</button>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Trạng thái kho</label>
          <select id="f-status" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="available" selected>Sẵn sàng (Available)</option>
            <option value="borrowed">Đang mượn (Borrowed)</option>
            <option value="repair">Bảo trì / Sửa chữa</option>
            <option value="lost">Báo mất</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Số lượng sẵn có</label>
          <input type="number" id="f-available-count" value="3"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-700 block mb-1">Tổng bản copy nhập kho</label>
          <input type="number" id="f-total-count" value="5"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div class="sm:col-span-4">
          <label class="text-xs font-semibold text-slate-700 block mb-1">Vị trí lưu kho chi tiết</label>
          <input type="text" id="f-location" value="Tầng 2, Khu Vực Công Nghệ, Kệ: IT-04, Ngăn: 2A"
            placeholder="Ví dụ: Tầng 2, Khu Vực Công Nghệ, Kệ: IT-04, Ngăn: 2A"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
      </div>
    </div>

    <!-- Section 4: Ảnh bìa & Tài nguyên số -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-2xs space-y-4">
      <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center gap-2 border-b border-slate-100 pb-3">
        <span class="material-symbols-outlined text-blue-600 text-lg">image</span>
        4. Ảnh bìa sách
      </h3>
      <div class="flex flex-col sm:flex-row items-start gap-6">
        <div class="w-28 h-40 rounded-xl overflow-hidden bg-slate-100 border border-slate-200 shrink-0 shadow-2xs">
          <img id="cover-preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFUqJjuaXSa_LoqI3VfK7RnYocqwKMYbFQ9HlPDzWUs_0kRxwO9pDLB5Et65hw3W7qkBxY_luq4pJ7H-1BQCoAim61oEg4byPAMUpXN3FMz7YTmoYM1I_vieY3B9UKskq9OixUBrvOLc58bx_MSY1VAs5i393ni6PQ5DHAzKMCKQJIxNX8FFZawxQSnnWSCryBEBI8KOh4RxqaX3uV3DFhfqjsBJ7xp7sA6DZigZuoxDorg3J6CczTGA" alt="Book cover preview" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
        </div>
        <div class="flex-1 space-y-3 w-full">
          <div>
            <label class="text-xs font-semibold text-slate-700 block mb-1">Đường dẫn ảnh bìa (Cover URL)</label>
            <input type="url" id="f-cover-url" value="https://lh3.googleusercontent.com/aida-public/AB6AXuBFUqJjuaXSa_LoqI3VfK7RnYocqwKMYbFQ9HlPDzWUs_0kRxwO9pDLB5Et65hw3W7qkBxY_luq4pJ7H-1BQCoAim61oEg4byPAMUpXN3FMz7YTmoYM1I_vieY3B9UKskq9OixUBrvOLc58bx_MSY1VAs5i393ni6PQ5DHAzKMCKQJIxNX8FFZawxQSnnWSCryBEBI8KOh4RxqaX3uV3DFhfqjsBJ7xp7sA6DZigZuoxDorg3J6CczTGA"
              class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" />
          </div>
          <p class="text-xs text-slate-400">Bạn có thể dán đường dẫn hình ảnh bìa trực tiếp từ hệ thống lưu trữ ảnh hoặc kho thư viện.</p>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="flex items-center justify-end gap-3 pt-2">
      <button type="button" id="btn-cancel" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-xl transition-colors">Hủy bỏ</button>
      <button id="btn-save-book" type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-blue-600/20 transition-all flex items-center gap-2 cursor-pointer">
        <span class="material-symbols-outlined text-lg">save</span>
        <span id="save-btn-label">Lưu thay đổi</span>
      </button>
    </div>
  </form>
</div>

<script>
  let currentType = 'physical';

  document.getElementById('type-physical-btn').addEventListener('click', () => setType('physical'));
  document.getElementById('type-digital-btn').addEventListener('click', () => setType('digital'));

  function setType(type) {
    currentType = type;
    const physicalBtn = document.getElementById('type-physical-btn');
    const digitalBtn = document.getElementById('type-digital-btn');
    if (type === 'physical') {
      physicalBtn.className = 'flex-1 py-2 rounded-xl text-xs font-semibold border bg-blue-50 text-blue-700 border-blue-500';
      digitalBtn.className = 'flex-1 py-2 rounded-xl text-xs font-semibold border bg-slate-50 text-slate-700 border-slate-200';
    } else {
      digitalBtn.className = 'flex-1 py-2 rounded-xl text-xs font-semibold border bg-purple-50 text-purple-700 border-purple-500';
      physicalBtn.className = 'flex-1 py-2 rounded-xl text-xs font-semibold border bg-slate-50 text-slate-700 border-slate-200';
    }
  }

  document.getElementById('btn-delete-record').addEventListener('click', () => {
    const title = document.getElementById('f-title').value;
    if (confirm(`Bạn có chắc chắn muốn xóa cuốn "${title}"?`)) {
      alert('Đã xóa (demo)');
    }
  });

  document.getElementById('btn-cancel').addEventListener('click', () => {
    alert('Đã hủy bỏ (demo)');
  });

  document.getElementById('f-cover-url').addEventListener('input', (e) => {
    document.getElementById('cover-preview').src = e.target.value;
  });

  document.getElementById('book-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('f-title').value;
    const author = document.getElementById('f-author').value;
    const isbn = document.getElementById('f-isbn').value;
    if (!title || !author || !isbn) {
      alert('Vui lòng điền đầy đủ Tiêu đề, Tác giả và mã ISBN!');
      return;
    }
    alert('Đã lưu thông tin sách (demo)');
  });
</script>
</body>
</html>
